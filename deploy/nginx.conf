# Reference copy of the host's /etc/nginx/nginx.conf for this stack.
# The live file is on the host; keep this in sync when you change either.
#
# Apply:
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak.$(date +%F)
#   sudo cp ~/projects/hetzner-stack/deploy/nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --expand -d hetzner.pratham82.in -d api.hetzner.pratham82.in

user www-data;

worker_processes auto;
worker_cpu_affinity auto;

pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    server_tokens off;

    # Shared proxy settings (inherited by all location blocks below)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # ==================== Frontend: hetzner.pratham82.in ====================
    server {
        listen 80;
        server_name hetzner.pratham82.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name hetzner.pratham82.in;

        ssl_certificate     /etc/letsencrypt/live/hetzner.pratham82.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hetzner.pratham82.in/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Frame-Options  "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";

        # Next.js standalone container
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==================== API: api.hetzner.pratham82.in =====================
    server {
        listen 80;
        server_name api.hetzner.pratham82.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.hetzner.pratham82.in;

        # Same SAN cert lineage; certbot --expand adds api.* to it.
        ssl_certificate     /etc/letsencrypt/live/hetzner.pratham82.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hetzner.pratham82.in/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Go (chi) container
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }

    # ---- Standalone plain-HTTP test server (kept from prior setup) ----
    server {
        listen 8888;
        location / {
            return 200 "Hello from NGINX\n";
        }
    }
}
